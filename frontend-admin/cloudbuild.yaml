steps:
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'frontend-admin'
    args:
      - build
      - '--build-arg'
      - 'VITE_API_URL=https://j2s-backend-401796347608.asia-northeast3.run.app/api'
      # APK가 준비되면 아래 줄의 주석을 해제하고 실제 다운로드 URL을 넣으세요.
      # - '--build-arg'
      # - 'VITE_APP_DOWNLOAD_URL=https://.../attendance-app.apk'
      - '-t'
      - 'asia-northeast3-docker.pkg.dev/j2s-p1-attendance/cloud-run-source-deploy/j2s-frontend'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - 'asia-northeast3-docker.pkg.dev/j2s-p1-attendance/cloud-run-source-deploy/j2s-frontend'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - j2s-frontend
      - '--image=asia-northeast3-docker.pkg.dev/j2s-p1-attendance/cloud-run-source-deploy/j2s-frontend'
      - '--region=asia-northeast3'
      - '--quiet'
images:
  - 'asia-northeast3-docker.pkg.dev/j2s-p1-attendance/cloud-run-source-deploy/j2s-frontend'
options:
  logging: CLOUD_LOGGING_ONLY

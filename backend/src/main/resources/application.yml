spring:
  datasource:
    url: ${SUPABASE_JDBC_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5        # Supabase 무료 플랜 커넥션 제한 대응
      connection-timeout: 20000
      ssl-mode: require           # Supabase는 SSL 필수
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  session:
    jdbc:
      # 관리자 세션 저장소. 테이블이 없으면 기동 시 만든다 (RLS 포함, session/schema-postgresql.sql)
      initialize-schema: always
      schema: classpath:session/schema-postgresql.sql

server:
  port: ${PORT:8080}
  error:
    include-message: always
  servlet:
    session:
      # 관리자 세션 유휴 만료 시간. 마지막 관리자 API 요청 이후 이 시간이 지나면 자동 로그아웃
      timeout: ${ADMIN_SESSION_TIMEOUT:10m}
      cookie:
        # Firebase Hosting(j2sp1.web.app)은 이름이 __session 인 쿠키만 Cloud Run 으로 넘기므로 이 이름을 바꾸면 안 된다
        name: __session
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}   # 운영(HTTPS)에서는 true (backend/cloudbuild.yaml)

app:
  qr:
    expiry-seconds: 60
  jwt:
    secret: ${JWT_SECRET:j2s-attendance-secret-key-must-be-at-least-256-bits-long-for-security}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

logging:
  level:
    com.j2s.attendance: DEBUG

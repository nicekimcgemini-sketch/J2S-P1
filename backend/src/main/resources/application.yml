spring:
  datasource:
    url: ${SUPABASE_JDBC_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5        # Supabase 무료 플랜 커넥션 제한 대응
      connection-timeout: 20000
      ssl-mode: require           # Supabase는 SSL 필수
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080

app:
  qr:
    expiry-seconds: 60
  jwt:
    secret: j2s-attendance-secret-key-must-be-at-least-256-bits-long-for-security
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173

logging:
  level:
    com.j2s.attendance: DEBUG

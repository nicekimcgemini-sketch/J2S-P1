# 테스트 전용 설정: Supabase 접속 없이 H2 인메모리 DB로 컨텍스트를 띄운다.
# @SpringBootTest 류 테스트에서 @ActiveProfiles("test") 와 함께 사용한다.
spring:
  datasource:
    url: jdbc:h2:mem:attendance-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 0

app:
  qr:
    expiry-seconds: 60
  jwt:
    secret: test-only-secret-key-must-be-at-least-256-bits-long-xxxxxxxxxxxxxxxx
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    com.j2s.attendance: INFO
